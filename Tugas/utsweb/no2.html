<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Mata Pelajaran Siswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h2 {
            font-weight: bold;
        }
        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #cfe2f3;
        }
        .nama-siswa {
            background-color: #f4cccc;
        }
        .mata-pelajaran {
            background-color: #d9ead3;
        }
        .hari {
            background-color: #dbb3ee;
        }
        .jam {
            background-color: #f8f7aa;
        }
    </style>
</head>
<body>

    <h2>Jadwal Mata Pelajaran Siswa</h2>

    <table>
        <tr>
            <th class="nama-siswa" rowspan="2">Nama Siswa</th>
            <th class="mata-pelajaran" rowspan="2">Mata Pelajaran</th>
            <th class="hari" colspan="2">Jadwal</th>
        </tr>
        <tr>
            <th class="hari">Hari</th>
            <th class="jam">Jam</th>
        </tr>
        <tr>
            <td class="nama-siswa" rowspan="2">Ahmad</td>
            <td class="mata-pelajaran">Matematika</td>
            <td class="hari">Senin</td>
            <td class="jam">08:00 - 09:30</td>
        </tr>
        <tr>
            <td class="mata-pelajaran">Bahasa Inggris</td>
            <td class="hari">Selasa</td>
            <td class="jam">10:00 - 11:30</td>
        </tr>
        <tr>
            <td class="nama-siswa" rowspan="1">Budi</td>
            <td class="mata-pelajaran">Fisika</td>
            <td class="hari">Rabu</td>
            <td class="jam">09:00 - 10:30</td>
        </tr>
    </table>

</body>
</html>
