<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            background-color: #4CAF50;
            font-size: 24px;
            color: white;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            animation: slide 8s linear infinite;
        }
        @keyframes slide {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        label, select, input, textarea {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .radio-group{
            display: flex;
            gap: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Tambahkan logo UNINDRA di sini -->
    <img src="logo-unindra.jpg" alt="Logo UNINDRA" class="logo">
    
    <h1>SELAMAT DATANG DI FORMULIR PENDAFTARAN ! Harap isi data dengan lengkap dan benar.</h1>
    <form action="#">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="tlp">Nomor Telepon:</label>
        <input type="text" id="tlp" name="tlp" required>

        <label for="birthdate">Tanggal Lahir:</label>
        <input type="date" id="birthdate" name="birthdate" required>
        
        <label for="gender">Jenis Kelamin:</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="laki-laki" required>Laki-laki</label>
            <label><input type="radio" name="gender" value="perempuan" required>Perempuan</label>
        </div>
        
        <label for="prodi">Program Studi:</label>
        <select id="prodi" name="prodi">
            <option value="ti">Teknik Informatika</option>
            <option value="si">Sistem Informasi</option>
            <option value="fis">Fisika</option>
        </select>

        <label for="address">Alamat:</label>
        <textarea id="address" name="address" rows="3" required></textarea>
        
        <input type="submit" value="Daftar">
    </form>
</body>
</html>
